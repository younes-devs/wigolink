<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- L'app (connexion + écrans authentifiés) n'est jamais du contenu public :
         noindex explicite, cf. docs/prd-seo.md §1 et §5.1. Le SEO vit dans les
         pages statiques de v1/client/public/ (landing, guides, produits). -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a6cf5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wigofly" />
    <!-- Thème (PRD UI/UX U9) : appliqué avant le rendu pour éviter le flash clair→sombre. -->
    <script>
      (function () {
        var t = localStorage.getItem('wigofly_theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>Wigofly — Envoyez avec confiance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
