<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="description" content="Trouvez des voyageurs vérifiés pour transporter vos colis et documents entre le Maroc et l'Europe avec Wigolink." />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="Données publiques Wigolink" />
    <link rel="icon" type="image/png" href="/assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.fr.webmanifest" />
    <meta name="theme-color" content="#0a6cf5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wigolink" />
    <!-- Apply theme and language before rendering to avoid a visual flash. -->
    <script>
      (function () {
        var t = localStorage.getItem('wigolink_theme');
        if (t !== 'light' && t !== 'dark') {
          t = 'light';
        }
        document.documentElement.dataset.theme = t;
        var languages = ['fr', 'ar', 'nl', 'en', 'es'];
        var pathLanguage = window.location.pathname.split('/')[1].toLowerCase();
        var storedLanguage = localStorage.getItem('wigolink_lang');
        var browserLanguages = navigator.languages || [navigator.language];
        var detectedLanguage = browserLanguages
          .map(function (value) { return String(value || '').toLowerCase().split(/[-_]/)[0]; })
          .find(function (value) { return languages.includes(value); });
        var l = languages.includes(pathLanguage)
          ? pathLanguage
          : languages.includes(storedLanguage) ? storedLanguage : detectedLanguage || 'fr';
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
    <title>Wigolink - Trajets pour colis et documents</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
