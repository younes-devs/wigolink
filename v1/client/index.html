<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The authenticated application is private and must not be indexed. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.fr.webmanifest" />
    <meta name="theme-color" content="#0a6cf5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wigolink" />
    <!-- Apply theme and language before rendering to avoid a visual flash. -->
    <script>
      (function () {
        var t = localStorage.getItem('wigolink_theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('wigolink_lang');
        if (l !== 'fr' && l !== 'ar' && l !== 'nl') l = 'fr';
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
    <title>Wigolink</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
